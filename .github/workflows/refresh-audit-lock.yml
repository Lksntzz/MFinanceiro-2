name: Refresh Safe Audit Lock

on:
  push:
    branches:
      - agent/mobile-product-integration
    paths:
      - .github/workflows/refresh-audit-lock.yml

permissions:
  contents: write

jobs:
  refresh-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-product-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes to lockfile
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No safe audit lock changes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply safe dependency audit fixes"
          git push origin HEAD:agent/mobile-product-integration
