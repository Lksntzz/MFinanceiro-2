name: Edge Hardening Patch

on:
  push:
    branches:
      - agent/remove-user-categorization-rules
    paths:
      - .github/workflows/edge-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/remove-user-categorization-rules
      - name: Patch statement OCR security controls
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/functions/statement-ocr/index.ts')
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, got {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          replace_once(
          '''} from "../_shared/adaptive-learning.ts";

          const corsHeaders = {
            "Access-Control-Allow-Origin": "*",
            "Access-Control-Allow-Headers": "authorization, x-client-info, apikey, content-type",
            "Access-Control-Allow-Methods": "POST, OPTIONS",
          };
          ''',
          '''} from "../_shared/adaptive-learning.ts";
          import {
            consumeRateLimit,
            corsHeaders,
            createServiceClient,
            jsonResponse,
            readSupabaseKey,
            recordOperationalEvent,
            valueRateLimitSubject,
          } from "../_shared/edge-security.ts";

          const OCR_RATE_LIMIT = 8;
          const OCR_RATE_WINDOW_SECONDS = 10 * 60;
          ''')

          start = text.index('function json(body: unknown, status = 200) {')
          end = text.index('function isoDate(value: unknown): string | null {')
          text = text[:start] + text[end:]

          replace_once(
          '''  if (request.method === "OPTIONS") return new Response("ok", { headers: corsHeaders });
            if (request.method !== "POST") return json({ error: "Método não permitido." }, 405);
          ''',
          '''  if (request.method === "OPTIONS") return new Response("ok", { headers: corsHeaders(request) });
            if (request.method !== "POST") return jsonResponse(request, { error: "Método não permitido." }, 405);
          ''')

          text = text.replace('return json({ error: "Autenticação necessária." }, 401);', 'return jsonResponse(request, { error: "Autenticação necessária." }, 401);')
          text = text.replace('return json({ error: "Supabase não configurado na função." }, 500);', 'return jsonResponse(request, { error: "Supabase não configurado na função." }, 500);')
          text = text.replace('return json({ error: "OCR/IA ainda não foi habilitado pelo administrador." }, 503);', 'return jsonResponse(request, { error: "OCR/IA ainda não foi habilitado pelo administrador." }, 503);')
          text = text.replace('return json({ error: "Sessão inválida." }, 401);', 'return jsonResponse(request, { error: "Sessão inválida." }, 401);')

          replace_once(
          '''  const { data: userData, error: userError } = await supabase.auth.getUser(token);
            if (userError || !userData.user) return jsonResponse(request, { error: "Sessão inválida." }, 401);

            let extractionId = "";
          ''',
          '''  const { data: userData, error: userError } = await supabase.auth.getUser(token);
            if (userError || !userData.user) return jsonResponse(request, { error: "Sessão inválida." }, 401);

            const admin = createServiceClient();
            const rateSubject = await valueRateLimitSubject("statement-ocr-user", userData.user.id);
            const rateDecision = await consumeRateLimit(admin, "statement-ocr", rateSubject, OCR_RATE_LIMIT, OCR_RATE_WINDOW_SECONDS);
            if (!rateDecision.allowed) {
              await recordOperationalEvent(admin, userData.user.id, "security.rate_limit", "statement-ocr", "warning", {
                operation: "extract",
                retryable: true,
                provider: "google-gemini",
              }).catch(() => {});
              return jsonResponse(
                request,
                { error: "Muitas análises de extrato em pouco tempo. Aguarde e tente novamente." },
                429,
                { "Retry-After": String(rateDecision.retryAfterSeconds) },
              );
            }

            let extractionId = "";
          ''')

          replace_once(
          '''    if (!aiResponse.ok) {
                const providerMessage = (await aiResponse.text()).slice(0, 500);
                throw new Error(`Falha no OCR/IA (${aiResponse.status}): ${providerMessage}`);
              }
          ''',
          '''    if (!aiResponse.ok) {
                await recordOperationalEvent(admin, userData.user.id, "provider.request_failed", "statement-ocr", "error", {
                  provider: "google-gemini",
                  operation: "extract",
                  http_status: aiResponse.status,
                  retryable: aiResponse.status === 429 || aiResponse.status >= 500,
                }).catch(() => {});
                throw new Error(`Falha temporária no OCR/IA (${aiResponse.status}).`);
              }
          ''')

          text = text.replace('return json({\n      extractionId,', 'return jsonResponse(request, {\n      extractionId,')
          text = text.replace('return json({ error: message }, 400);', 'return jsonResponse(request, { error: message }, 400);')

          if 'Access-Control-Allow-Origin": "*"' in text:
              raise SystemExit('Wildcard CORS remained in statement-ocr')
          for required in ('consumeRateLimit', 'recordOperationalEvent', 'jsonResponse(request', 'corsHeaders(request)'):
              if required not in text:
                  raise SystemExit(f'Missing hardening marker: {required}')

          path.write_text(text)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/statement-ocr/index.ts
          git diff --cached --check
          git commit -m "security: rate limit and observe statement OCR"
          git push origin HEAD:agent/remove-user-categorization-rules
