name: Mobile CI

on:
  push:
    branches:
      - agent/mobile-foundation
      - agent/mobile-product-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Mobile logic checks
        run: npm run mobile:check

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Validate iOS property list
        run: python -c "import plistlib; plistlib.load(open('ios/App/App/Info.plist', 'rb')); print('iOS Info.plist OK')"

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Compile Android debug shell
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon
