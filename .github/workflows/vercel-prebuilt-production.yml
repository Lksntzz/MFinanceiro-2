name: Production Deploy (Prebuilt)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vercel-prebuilt-production.yml

permissions:
  contents: read

concurrency:
  group: production-deploy-prebuilt
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_Q4OjsxC51APH6ge4YFvJhrSu
  VERCEL_TEAM_ID: team_Q4OjsxC51APH6ge4YFvJhrSu
  VERCEL_PROJECT_ID: prj_GAVmGXR2XkGzOUKgmghlwDtvDcuH

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security policy checks
        run: npm run security:check

      - name: Product maturity checks
        run: npm run product:check

      - name: TypeScript check
        run: npm run lint

      - name: Verify Vercel project access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            > /dev/null

      - name: Fetch public production build variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?decrypt=true&teamId=$VERCEL_TEAM_ID" \
            > "$RUNNER_TEMP/vercel-env.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const payload = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'vercel-env.json'), 'utf8'));
          const envs = Array.isArray(payload.envs)
            ? payload.envs
            : Array.isArray(payload.data)
              ? payload.data
              : Array.isArray(payload)
                ? payload
                : [];

          const selected = new Map();
          for (const entry of envs) {
            if (!entry || typeof entry.key !== 'string' || !entry.key.startsWith('VITE_')) continue;
            const targets = Array.isArray(entry.target)
              ? entry.target
              : entry.target
                ? [entry.target]
                : [];
            if (targets.length && !targets.includes('production')) continue;
            if (typeof entry.value !== 'string' || !entry.value.length) continue;
            selected.set(entry.key, entry.value);
          }

          for (const key of ['VITE_SUPABASE_URL', 'VITE_SUPABASE_ANON_KEY']) {
            if (!selected.has(key)) throw new Error(`Missing required production variable: ${key}`);
          }

          const lines = [...selected.entries()].map(([key, value]) => `${key}=${JSON.stringify(value)}`);
          fs.writeFileSync('.env.production.local', `${lines.join('\n')}\n`, { mode: 0o600 });
          console.log(`Prepared ${selected.size} public VITE_* variables for the production build.`);
          NODE
          rm -f "$RUNNER_TEMP/vercel-env.json"

      - name: Install pinned Vercel tooling
        run: npm install --no-save --package-lock=false vercel@58.9.1

      - name: Build production app locally
        run: npm run build

      - name: Assemble Vercel Build Output API artifact
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R dist/. .vercel/output/static/
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { getTransformedRoutes } from '@vercel/routing-utils';

          const projectConfig = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const { routes } = getTransformedRoutes(projectConfig);
          fs.writeFileSync(
            '.vercel/output/config.json',
            JSON.stringify({ version: 3, routes }, null, 2),
          );
          NODE
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          rm -f .env.production.local

      - name: Deploy prebuilt artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: ./node_modules/.bin/vercel deploy --prebuilt --prod -T "$VERCEL_TEAM_ID" --token="$VERCEL_TOKEN"
