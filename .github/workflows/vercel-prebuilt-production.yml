name: Production Deploy (Prebuilt)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vercel-prebuilt-production.yml

permissions:
  contents: read

concurrency:
  group: production-deploy-prebuilt
  cancel-in-progress: false

env:
  VERCEL_TEAM_ID: team_Q4OjsxC51APH6ge4YFvJhrSu
  VERCEL_PROJECT_ID: prj_GAVmGXR2XkGzOUKgmghlwDtvDcuH

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security policy checks
        run: npm run security:check

      - name: Product maturity checks
        run: npm run product:check

      - name: TypeScript check
        run: npm run lint

      - name: Verify Vercel project access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_TEAM_ID" \
            > /dev/null

      - name: Write local Vercel project link
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_TEAM_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.9.1 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact locally
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.9.1 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@58.9.1 deploy --prebuilt --prod -T "$VERCEL_TEAM_ID" --token="$VERCEL_TOKEN"
