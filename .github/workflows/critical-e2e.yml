name: Critical E2E Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL do Preview Vercel do commit exato'
        required: true
        type: string

permissions:
  contents: read

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MF_E2E_BASE_URL: ${{ inputs.base_url }}
      MF_E2E_EMAIL: ${{ secrets.MF_E2E_EMAIL }}
      MF_E2E_PASSWORD: ${{ secrets.MF_E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Require QA credentials
        run: |
          test -n "$MF_E2E_EMAIL" || (echo 'Configure o secret MF_E2E_EMAIL com uma conta de QA não produtiva.' && exit 1)
          test -n "$MF_E2E_PASSWORD" || (echo 'Configure o secret MF_E2E_PASSWORD com uma conta de QA não produtiva.' && exit 1)

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated browser smoke
        run: npx playwright test --config=playwright.preview.config.ts
