name: Mobile Profile Patch Once

on:
  push:
    branches:
      - agent/mobile-profile-scoped-maintenance
    paths:
      - .github/workflows/mobile-profile-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-profile-scoped-maintenance
          fetch-depth: 0
      - name: Apply scoped patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing {label}')
              return text.replace(old, new, 1)

          app = Path('src/App.tsx')
          text = app.read_text()
          text = one(text, "  fetchMaintenanceConfig,\n  isMaintenanceAdmin,\n", "  fetchMaintenanceConfig,\n  getMaintenanceForSurface,\n  isMaintenanceAdmin,\n", 'app maintenance import')
          text = one(text, "} from './lib/maintenance';\n", "} from './lib/maintenance';\nimport { isCurrentMobileExperience } from './mobile/useMobileExperience';\n", 'mobile detector import')
          text = re.sub(r"\nfunction normalizeMaintenanceRow\(row: any\): MaintenanceConfig \{.*?\n\}\n", "\n", text, count=1, flags=re.S)
          old = """      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'mf_global_settings',
          filter: 'key=eq.global',
        },
        (payload) => {
          const row = payload.new as any;
          if (row && Object.keys(row).length) applyMaintenance(normalizeMaintenanceRow(row));
          else void refreshMaintenance();
        },
      )
      .on('broadcast', { event: MAINTENANCE_BROADCAST_EVENT }, ({ payload }) => {
        if (payload) applyMaintenance(normalizeMaintenanceRow(payload));
      })"""
          new = """      .on(
        'postgres_changes',
        {
          event: '*',
          schema: 'public',
          table: 'mf_global_settings',
        },
        () => { void refreshMaintenance(); },
      )
      .on('broadcast', { event: MAINTENANCE_BROADCAST_EVENT }, ({ payload }) => {
        if (payload) applyMaintenance(payload as MaintenanceConfig);
        else void refreshMaintenance();
      })"""
          text = one(text, old, new, 'app realtime block')
          text = one(text, "  const maintenanceEnabled = Boolean(maintenance?.maintenance_mode);\n", "  const maintenanceSurface = isCurrentMobileExperience() ? 'mobile' : 'desktop';\n  const surfaceMaintenance = getMaintenanceForSurface(maintenance, maintenanceSurface);\n  const maintenanceEnabled = surfaceMaintenance.maintenance_mode;\n", 'surface gate')
          text = one(text, '<MaintenanceScreen message={maintenance?.maintenance_message} />', '<MaintenanceScreen message={surfaceMaintenance.maintenance_message} />', 'surface message')
          app.write_text(text)

          desktop = Path('src/components/AdminMaintenanceControl.tsx')
          text = desktop.read_text()
          text = one(text, "    maintenance_mode: false,\n    maintenance_message: DEFAULT_MESSAGE,\n", "    maintenance_mode: false,\n    maintenance_message: DEFAULT_MESSAGE,\n    mobile_mode: false,\n    mobile_message: DEFAULT_MESSAGE,\n    desktop_mode: false,\n    desktop_message: DEFAULT_MESSAGE,\n", 'desktop config')
          text = text.replace('next.maintenance_message || DEFAULT_MESSAGE', 'next.desktop_message || DEFAULT_MESSAGE')
          text = text.replace('config.maintenance_mode', 'config.desktop_mode')
          old = """      const { data, error: rpcError } = await supabase.rpc('mf_set_maintenance_mode', {
        p_enabled: enabled,
        p_message: normalizedMessage,
      });
      if (rpcError) throw rpcError;

      const row = Array.isArray(data) ? data[0] : data;
      const next: MaintenanceConfig = {
        maintenance_mode: Boolean(row?.maintenance_mode ?? enabled),
        maintenance_message: String(row?.maintenance_message || normalizedMessage),
      };

      setConfig(next);
      setMessage(next.maintenance_message);"""
          new = """      const { error: rpcError } = await supabase.rpc('mf_set_maintenance_scope', {
        p_scope: 'desktop',
        p_enabled: enabled,
        p_message: normalizedMessage,
      });
      if (rpcError) throw rpcError;

      const next = await fetchMaintenanceConfig(supabase);
      setConfig(next);
      setMessage(next.desktop_message);"""
          text = one(text, old, new, 'desktop rpc')
          desktop.write_text(text)

          mobile = Path('src/mobile/MobileApp.tsx')
          text = mobile.read_text()
          text = one(text, '  Wallet,\n', '  UserRound,\n  Wallet,\n', 'profile icon')
          text = one(text, "import MobilePurchaseImpact from './pages/MobilePurchaseImpact';\n", "import MobilePurchaseImpact from './pages/MobilePurchaseImpact';\nimport MobileProfile from './pages/MobileProfile';\n", 'profile import')
          old = "        <button type=\"button\" onClick={() => navigate(MOBILE_ROUTES.inbox)}><span className=\"mf-mobile-menu-icon\"><Inbox size={19} /></span><div><strong>MF Inbox</strong><small>Revisar extratos e lançamentos extraídos</small></div><ChevronRight size={18} /></button>"
          new = "        <button type=\"button\" onClick={() => navigate(MOBILE_ROUTES.profile)}><span className=\"mf-mobile-menu-icon\"><UserRound size={19} /></span><div><strong>Perfil</strong><small>Conta, preferências e segurança</small></div><ChevronRight size={18} /></button>\n" + old
          text = one(text, old, new, 'profile menu')
          text = one(text, "    if (path === MOBILE_ROUTES.scan) return 'scan';\n", "    if (path === MOBILE_ROUTES.scan) return 'scan';\n    if (path === MOBILE_ROUTES.profile) return 'profile';\n", 'profile resolver')
          text = one(text, "  if (page === 'scan') return <MobileScan userId={user.id} accounts={data.accounts} categories={data.categories} history={data.categorizationHistory} onSaved={refresh} />;\n", "  if (page === 'scan') return <MobileScan userId={user.id} accounts={data.accounts} categories={data.categories} history={data.categorizationHistory} onSaved={refresh} />;\n  if (page === 'profile') return <MobileProfile user={user} settings={data.settings} onProfileSaved={refresh} />;\n", 'profile render')
          mobile.write_text(text)

          contract = Path('scripts/mobile-layout-contract-check.ts')
          text = contract.read_text()
          text = one(text, "assert.ok(moreBlock.includes('<strong>MF Inbox</strong>'), 'Approved More surface must keep MF Inbox');\n", "assert.ok(moreBlock.includes('<strong>Perfil</strong>'), 'Approved More surface must keep the authorized mobile profile entry');\nassert.ok(moreBlock.includes('<strong>MF Inbox</strong>'), 'Approved More surface must keep MF Inbox');\n", 'profile contract')
          text = one(text, "for (const route of ['documentInbox', 'purchaseImpact', 'pulse']) {", "for (const route of ['profile', 'documentInbox', 'purchaseImpact', 'pulse']) {", 'profile route contract')
          contract.write_text(text)
          PY
      - name: Commit patches
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/AdminMaintenanceControl.tsx src/mobile/MobileApp.tsx scripts/mobile-layout-contract-check.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire mobile profile and scoped maintenance"
          git push origin HEAD:agent/mobile-profile-scoped-maintenance
