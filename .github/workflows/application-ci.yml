name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/security-architecture-hardening

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: '2.9.5'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Security policy checks
        run: npm run security:check

      - name: Product maturity checks
        run: npm run product:check

      - name: Block 4 module tests
        run: npm test

      - name: TypeScript check
        run: npm run lint

      - name: Edge Function type checks
        run: |
          deno check --config supabase/functions/access-request/deno.json supabase/functions/access-request/index.ts
          deno check --config supabase/functions/operational-event/deno.json supabase/functions/operational-event/index.ts
          deno check --config supabase/functions/document-ocr/deno.json supabase/functions/document-ocr/index.ts
          deno check --config supabase/functions/statement-ocr/deno.json supabase/functions/statement-ocr/index.ts
          deno check --config supabase/functions/open-finance-session/deno.json supabase/functions/open-finance-session/index.ts

      - name: Production build
        run: npm run build
