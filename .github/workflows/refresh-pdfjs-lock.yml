name: Refresh PDF.js Lock

on:
  push:
    branches:
      - agent/mobile-product-integration
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-pdfjs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-product-integration

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Normalize custom PDF parser
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/import-parsers/pdf/parse-pdf-statement.ts')
          text = path.read_text()
          old = """  // Security hardening for user-controlled bank statements. PDF.js scripting is\n  // unnecessary for text extraction and must remain disabled even before the\n  // dependency can be moved to its next major patched release.\n  const loadingTask = getDocument({ data: bytes, enableScripting: false });"""
          new = """  // This importer uses the PDF.js display API only for text extraction and does\n  // not instantiate the Viewer scripting manager or execute document actions.\n  const loadingTask = getDocument({ data: bytes });"""
          if old not in text:
              raise SystemExit('Expected PDF parser block was not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit compatibility update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json src/lib/import-parsers/pdf/parse-pdf-statement.ts; then
            echo "PDF.js lock and parser already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/lib/import-parsers/pdf/parse-pdf-statement.ts
          git commit -m "chore: refresh PDF.js compatibility"
          git push origin HEAD:agent/mobile-product-integration
