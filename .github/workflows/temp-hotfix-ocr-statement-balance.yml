name: Temporary OCR statement balance hotfix

on:
  push:
    branches:
      - hotfix/ocr-statement-balance
    paths:
      - .github/workflows/temp-hotfix-ocr-statement-balance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/ocr-statement-balance
          fetch-depth: 0

      - name: Apply guarded component patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/ImportarExtratosCore.tsx')
          text = path.read_text()

          replacements = [
              (
                  "  const [ocrExtractionId, setOcrExtractionId] = useState<string | null>(null);\n  const [rejectedOcrItemIds, setRejectedOcrItemIds] = useState<string[]>([]);",
                  "  const [ocrExtractionId, setOcrExtractionId] = useState<string | null>(null);\n  const [ocrStatementBalance, setOcrStatementBalance] = useState<number | undefined>(undefined);\n  const [rejectedOcrItemIds, setRejectedOcrItemIds] = useState<string[]>([]);",
                  1,
              ),
              (
                  "  const balanceValidation = calculateImportBalanceValidation(importedData);",
                  "  const balanceValidation = calculateImportBalanceValidation(importedData, ocrStatementBalance);",
                  1,
              ),
              (
                  "    setOcrExtractionId(null);\n    setRejectedOcrItemIds([]);",
                  "    setOcrExtractionId(null);\n    setOcrStatementBalance(undefined);\n    setRejectedOcrItemIds([]);",
                  2,
              ),
              (
                  "      let currentOcrExtractionId: string | null = null;\n      let ocrWarnings: string[] = [];",
                  "      let currentOcrExtractionId: string | null = null;\n      let currentOcrStatementBalance: number | undefined;\n      let ocrWarnings: string[] = [];",
                  1,
              ),
              (
                  "            currentOcrExtractionId = ocrResult.extractionId;\n            ocrDocumentConfidence = ocrResult.documentConfidence;\n            ocrWarnings = ocrResult.warnings;",
                  "            currentOcrExtractionId = ocrResult.extractionId;\n            ocrDocumentConfidence = ocrResult.documentConfidence;\n            currentOcrStatementBalance = ocrResult.statementBalance;\n            ocrWarnings = ocrResult.warnings;",
                  1,
              ),
              (
                  "        currentOcrExtractionId = ocrResult.extractionId;\n        ocrDocumentConfidence = ocrResult.documentConfidence;\n        ocrWarnings = ocrResult.warnings;",
                  "        currentOcrExtractionId = ocrResult.extractionId;\n        ocrDocumentConfidence = ocrResult.documentConfidence;\n        currentOcrStatementBalance = ocrResult.statementBalance;\n        ocrWarnings = ocrResult.warnings;",
                  1,
              ),
              (
                  "      setImportedData(normalized);\n      setOcrExtractionId(currentOcrExtractionId);",
                  "      setImportedData(normalized);\n      setOcrExtractionId(currentOcrExtractionId);\n      setOcrStatementBalance(currentOcrStatementBalance);",
                  1,
              ),
          ]

          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'anchor mismatch: expected {expected}, found {actual}: {old[:90]!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ImportarExtratosCore.tsx
          git commit -m "fix: wire OCR statement balance into review"
          git push origin HEAD:hotfix/ocr-statement-balance
