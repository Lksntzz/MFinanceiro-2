.mf-mobile-profile__card { border: 1px solid rgba(255,255,255,.09); border-radius: 22px; background: rgba(255,255,255,.028); padding: 16px; margin-top: 14px; }
.mf-mobile-profile__section-title { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 16px; color: #8df6ff; }
.mf-mobile-profile__section-title strong, .mf-mobile-profile__section-title span { display: block; }
.mf-mobile-profile__section-title strong { color: white; font-size: 14px; }
.mf-mobile-profile__section-title span { margin-top: 3px; font-size: 11px; color: rgba(255,255,255,.4); }
.mf-mobile-profile__card label { display: block; margin-top: 12px; }
.mf-mobile-profile__card label > span { display: block; margin-bottom: 7px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: rgba(255,255,255,.42); }
.mf-mobile-profile__card input, .mf-mobile-profile__card textarea { width: 100%; box-sizing: border-box; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(255,255,255,.04); color: white; padding: 12px 13px; font: inherit; outline: none; }
.mf-mobile-profile__card textarea { resize: vertical; min-height: 94px; }
.mf-mobile-profile__card input:focus, .mf-mobile-profile__card textarea:focus { border-color: rgba(0,242,255,.45); }
.mf-mobile-profile__card input[readonly] { color: rgba(255,255,255,.5); }

.mf-mobile-profile__primary, .mf-mobile-profile__warning, .mf-mobile-profile__secondary, .mf-mobile-profile__logout { width: 100%; min-height: 46px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 850; }
.mf-mobile-profile__primary { margin-top: 16px; border: 0; background: #00eaf7; color: #001013; }
.mf-mobile-profile__warning { border: 0; background: #f7b955; color: #171006; }
.mf-mobile-profile__secondary { border: 1px solid rgba(255,255,255,.11); background: rgba(255,255,255,.04); color: white; }
.mf-mobile-profile__logout { margin-top: 18px; border: 1px solid rgba(255,94,94,.18); background: rgba(255,75,75,.07); color: #ff9b9b; }
.mf-mobile-profile__primary:disabled, .mf-mobile-profile__warning:disabled, .mf-mobile-profile__secondary:disabled { opacity: .5; }

.mf-mobile-profile__status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.mf-mobile-profile__status-grid > div { border: 1px solid rgba(255,255,255,.09); border-radius: 15px; padding: 12px; background: rgba(255,255,255,.025); }
.mf-mobile-profile__status-grid svg, .mf-mobile-profile__status-grid span, .mf-mobile-profile__status-grid b { display: block; }
.mf-mobile-profile__status-grid span { margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.46); }
.mf-mobile-profile__status-grid b { margin-top: 3px; font-size: 11px; color: #8be9a7; }
.mf-mobile-profile__status-grid > div[data-active='true'] { border-color: rgba(247,185,85,.28); background: rgba(247,185,85,.07); }
.mf-mobile-profile__status-grid > div[data-active='true'] b { color: #ffd088; }

.mf-mobile-profile__scope { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 14px; }
.mf-mobile-profile__scope button { min-width: 0; border: 1px solid rgba(255,255,255,.09); border-radius: 13px; background: rgba(255,255,255,.03); color: rgba(255,255,255,.6); padding: 10px 6px; display: flex; gap: 5px; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; }
.mf-mobile-profile__scope button[data-active='true'] { border-color: rgba(0,242,255,.38); background: rgba(0,242,255,.1); color: #8cf7ff; }
.mf-mobile-profile__maintenance-note { margin: 12px 0 0; font-size: 11px; line-height: 1.55; color: rgba(255,255,255,.42); }
.mf-mobile-profile__maintenance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 14px; }
.mf-mobile-profile__feedback { margin: 12px 0 0; border-radius: 12px; padding: 9px 11px; font-size: 11px; }
.mf-mobile-profile__feedback[data-tone='success'] { background: rgba(44,210,110,.09); color: #8be9a7; }
.mf-mobile-profile__feedback[data-tone='danger'] { background: rgba(255,75,75,.09); color: #ff9b9b; }
.mf-mobile-profile__loading { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; font-size: 11px; color: rgba(255,255,255,.44); }

@media (max-width: 360px) {
  .mf-mobile-profile__scope { grid-template-columns: 1fr; }
  .mf-mobile-profile__maintenance-actions { grid-template-columns: 1fr; }
}
''')

          # Wire profile into More and secondary routing while preserving the primary nav.
          mobile_app = Path('src/mobile/MobileApp.tsx')
          text = mobile_app.read_text()
          text = replace_once(text, '  Wallet,\n', '  UserRound,\n  Wallet,\n', 'profile icon import')
          text = replace_once(text, "import MobilePurchaseImpact from './pages/MobilePurchaseImpact';\n", "import MobilePurchaseImpact from './pages/MobilePurchaseImpact';\nimport MobileProfile from './pages/MobileProfile';\n", 'profile page import')
          inbox_button = '''        <button type="button" onClick={() => navigate(MOBILE_ROUTES.inbox)}><span className="mf-mobile-menu-icon"><Inbox size={19} /></span><div><strong>MF Inbox</strong><small>Revisar extratos e lançamentos extraídos</small></div><ChevronRight size={18} /></button>'''
          profile_plus_inbox = '''        <button type="button" onClick={() => navigate(MOBILE_ROUTES.profile)}><span className="mf-mobile-menu-icon"><UserRound size={19} /></span><div><strong>Perfil</strong><small>Conta, preferências e segurança</small></div><ChevronRight size={18} /></button>
        <button type="button" onClick={() => navigate(MOBILE_ROUTES.inbox)}><span className="mf-mobile-menu-icon"><Inbox size={19} /></span><div><strong>MF Inbox</strong><small>Revisar extratos e lançamentos extraídos</small></div><ChevronRight size={18} /></button>'''
          text = replace_once(text, inbox_button, profile_plus_inbox, 'profile entry in More')
          text = replace_once(text, "    if (path === MOBILE_ROUTES.scan) return 'scan';\n", "    if (path === MOBILE_ROUTES.scan) return 'scan';\n    if (path === MOBILE_ROUTES.profile) return 'profile';\n", 'profile route resolver')
          text = replace_once(text, "  if (page === 'scan') return <MobileScan userId={user.id} accounts={data.accounts} categories={data.categories} history={data.categorizationHistory} onSaved={refresh} />;\n", "  if (page === 'scan') return <MobileScan userId={user.id} accounts={data.accounts} categories={data.categories} history={data.categorizationHistory} onSaved={refresh} />;\n  if (page === 'profile') return <MobileProfile user={user} settings={data.settings} onProfileSaved={refresh} />;\n", 'profile page render')
          mobile_app.write_text(text)

          # Update the frozen mobile contract: Perfil is now explicitly approved in More.
          contract = Path('scripts/mobile-layout-contract-check.ts')
          text = contract.read_text()
          text = replace_once(text, "assert.ok(moreBlock.includes('<strong>MF Inbox</strong>'), 'Approved More surface must keep MF Inbox');\n", "assert.ok(moreBlock.includes('<strong>Perfil</strong>'), 'Approved More surface must keep the authorized mobile profile entry');\nassert.ok(moreBlock.includes('<strong>MF Inbox</strong>'), 'Approved More surface must keep MF Inbox');\n", 'authorized profile contract')
          text = replace_once(text, "for (const route of ['documentInbox', 'purchaseImpact', 'pulse']) {", "for (const route of ['profile', 'documentInbox', 'purchaseImpact', 'pulse']) {", 'profile route contract')
          contract.write_text(text)

          # Maintenance-specific contract checks.
          Path('scripts/scoped-maintenance-contract-check.ts').write_text(r'''import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';

const app = readFileSync('src/App.tsx', 'utf8');
const maintenance = readFileSync('src/lib/maintenance.ts', 'utf8');
const desktopControl = readFileSync('src/components/AdminMaintenanceControl.tsx', 'utf8');
const mobileProfile = readFileSync('src/mobile/pages/MobileProfile.tsx', 'utf8');
const shell = readFileSync('src/mobile/MobileAppShell.tsx', 'utf8');

assert.ok(app.includes("isCurrentMobileExperience() ? 'mobile' : 'desktop'"), 'Maintenance gate must choose the active client surface');
assert.ok(app.includes('getMaintenanceForSurface'), 'App must resolve maintenance per surface');
assert.ok(maintenance.includes(".in('key', ['global', 'mobile', 'desktop'])"), 'Maintenance config must load scoped keys with legacy fallback');
assert.ok(maintenance.includes('mobile_mode') && maintenance.includes('desktop_mode'), 'Maintenance config must expose independent mobile and desktop states');
assert.ok(desktopControl.includes("p_scope: 'desktop'"), 'Desktop maintenance button must only mutate desktop maintenance');
assert.ok(!desktopControl.includes("p_scope: 'both'"), 'Desktop maintenance button must never silently become global');
assert.ok(mobileProfile.includes("setScope('mobile')") && mobileProfile.includes("setScope('desktop')") && mobileProfile.includes("setScope('both')"), 'Mobile admin profile must expose mobile, desktop and both scopes');
assert.ok(mobileProfile.includes("supabase.rpc('mf_set_maintenance_scope'"), 'Mobile maintenance must use the scoped privileged RPC');
assert.ok(mobileProfile.includes('mfa.getAuthenticatorAssuranceLevel'), 'Privileged mobile maintenance must retain MFA session checks');
assert.ok(shell.includes("label: 'Início'") && shell.includes("label: 'Movimentos'") && shell.includes("label: 'Cartões'") && shell.includes("label: 'Mais'"), 'Primary mobile navigation must remain unchanged');

console.log('Scoped maintenance contract: mobile/desktop isolation preserved.');
''')

          package = Path('package.json')
          text = package.read_text()
          text = replace_once(
              text,
              '"mobile:check": "tsx scripts/mobile-logic-check.ts && tsx scripts/native-shell-check.ts && tsx scripts/mobile-layout-contract-check.ts"',
