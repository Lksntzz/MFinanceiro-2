          )
          text = text.replace('next.maintenance_message || DEFAULT_MESSAGE', 'next.desktop_message || DEFAULT_MESSAGE')
          text = text.replace('config.maintenance_mode', 'config.desktop_mode')
          old_save = '''      const { data, error: rpcError } = await supabase.rpc('mf_set_maintenance_mode', {
