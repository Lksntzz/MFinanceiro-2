name: Temporary comprehensive stabilization

on:
  push:
    branches:
      - staging/mf-admin-observability-1.4
    paths:
      - .github/workflows/temp-comprehensive-stabilization.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/mf-admin-observability-1.4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply guarded cross-cutting fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} anchor(s), found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new))

          replace(
              'src/types.ts',
              "  institution_name?: string | null;\n  opening_balance: number;",
              "  institution_name?: string | null;\n  provider?: string | null;\n  provider_account_ref?: string | null;\n  bank_connection_id?: string | null;\n  opening_balance: number;",
          )
          replace(
              'src/types.ts',
              "  parserName?: string;\n  diagnostics?: Record<string, unknown>;",
              "  parserName?: string;\n  correlationId?: string;\n  diagnostics?: Record<string, unknown>;",
          )

          replace(
              'src/components/ImportarExtratosCore.tsx',
              "        parserName: importDiagnostics?.parserLabel,\n        diagnostics: importDiagnostics",
              "        parserName: importDiagnostics?.parserLabel,\n        correlationId,\n        diagnostics: importDiagnostics",
          )

          replace(
              'src/hooks/useDashboardWorkspace.ts',
              "    const command = buildStatementImportCommand(imported, newBalance, options);\n    const correlationId = createOperationalCorrelationId();",
              "    const command = buildStatementImportCommand(imported, newBalance, options);\n    const correlationId = options.correlationId || createOperationalCorrelationId();",
          )

          old_pay = '''  const payFixedBill = useCallback(async (bill: FixedBill) => {
    const { error: entryError } = await supabase.rpc('mf_create_finance_entry_v3', {
      p_type: 'expense',
      p_amount: Math.abs(Number(bill.amount || 0)),
      p_date: format(new Date(), 'yyyy-MM-dd'),
      p_description: `Pagamento: ${bill.name}`,
      p_account_id: null,
      p_category_id: null,
      p_category: bill.category || 'Contas Fixas',
      p_payment_method: 'unspecified',
      p_status: 'paid',
      p_source: 'Agenda',
      p_card_id: null,
      p_due_date: null,
      p_notes: null,
      p_installment_count: 1,
    });
    if (entryError) {
      reportOperationalEvent('fixed_bill.pay_failed', 'fixed-bill', 'error', { phase: 'create_entry' }, { impact: 'financial_risk' });
      setError(entryError.message);
      return;
    }
    const { error: billError } = await supabase.from('mf_fixed_bills').update({ status: 'paid', last_paid_month: format(new Date(), 'yyyy-MM') }).eq('id', bill.id).eq('user_id', userId);
    if (billError) {
      reportOperationalEvent('fixed_bill.pay_failed', 'fixed-bill', 'error', { phase: 'mark_bill_paid' }, { impact: 'financial_risk' });
      setError(billError.message);
      return;
    }
    await refresh();
  }, [refresh, userId]);'''
          new_pay = '''  const payFixedBill = useCallback(async (bill: FixedBill) => {
    const correlationId = createOperationalCorrelationId();
    const startedAt = performance.now();
    const { error: paymentError } = await supabase.rpc('mf_pay_fixed_bill_current', {
      p_fixed_bill_id: bill.id,
      p_payment_method: 'unspecified',
    });
    if (paymentError) {
      reportOperationalEvent('fixed_bill.pay_failed', 'fixed-bill', 'error', { phase: 'atomic_payment' }, {
        correlationId,
        durationMs: performance.now() - startedAt,
        impact: 'financial_risk',
      });
      setError(paymentError.message);
      return;
    }
    await refresh();
  }, [refresh]);'''
          replace('src/hooks/useDashboardWorkspace.ts', old_pay, new_pay)

          replace(
              'supabase/functions/statement-ocr/index.ts',
              "      adaptiveCategoryMatches,\n      warnings: metadata.warnings,",
              "      adaptiveCategoryMatches,\n      statementBalance: metadata.statement_balance,\n      warnings: metadata.warnings,",
          )
          PY

      - name: Add stabilization contract tests
        run: |
          cat > tests/stabilization-contracts.test.ts <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const read = (path: string) => readFileSync(path, 'utf8');

          test('Open Finance sync writes canonical account table, never the balance view', () => {
            const sync = read('supabase/functions/open-finance-sync/index.ts');
            assert.doesNotMatch(sync, /from\(["']mf_account_balances["']\)/);
            assert.match(sync, /mf_upsert_open_finance_account_service/);
            assert.match(sync, /mf_upsert_open_finance_entry_service/);
            assert.match(sync, /mf_reconcile_open_finance_account_balance_service/);
            assert.match(sync, /OPEN_FINANCE_PROVIDER_BALANCE_MISSING/);
          });

          test('Open Finance migration owns provider metadata on canonical accounts', () => {
            const migration = read('supabase/migrations/20260807130000_pluggy_open_finance_integration.sql');
            assert.match(migration, /alter table public\.mf_financial_accounts/);
            assert.match(migration, /bank_connection_id/);
            assert.match(migration, /create or replace view public\.mf_account_balances/);
            assert.doesNotMatch(migration, /alter table public\.mf_account_balances/);
            assert.match(migration, /to service_role/);
          });

          test('Pluggy pagination fails closed instead of returning truncated history', () => {
            const pluggy = read('supabase/functions/_shared/pluggy.ts');
            assert.match(pluggy, /MAX_TRANSACTION_PAGES/);
            assert.match(pluggy, /excedeu o limite seguro de páginas/);
            assert.doesNotMatch(pluggy, /text\.slice\(0, 300\)/);
          });

          test('browser bind verifies Pluggy clientUserId ownership', () => {
            const session = read('supabase/functions/open-finance-session/index.ts');
            assert.match(session, /fetchItem\(apiKey, itemId\)/);
            assert.match(session, /providerOwner !== userData\.user\.id/);
            assert.match(session, /OPEN_FINANCE_BIND_OWNERSHIP_MISMATCH/);
          });

          test('webhook does not persist or echo raw provider failure payloads', () => {
            const webhook = read('supabase/functions/open-finance-webhook/index.ts');
            assert.doesNotMatch(webhook, /JSON\.stringify\(payload\.error/);
            assert.doesNotMatch(webhook, /syncError:\s*syncPayload/);
            assert.match(webhook, /deletedTransactionIds/);
          });

          test('service telemetry is best effort even without EdgeRuntime waitUntil', () => {
            const telemetry = read('supabase/functions/_shared/mf-admin-telemetry.ts');
            assert.match(telemetry, /function keepAlive/);
            assert.match(telemetry, /void task/);
            assert.match(telemetry, /diagnostics are strictly best-effort/);
          });

          test('fixed bill payment is a single atomic RPC from the client', () => {
            const hook = read('src/hooks/useDashboardWorkspace.ts');
            assert.match(hook, /mf_pay_fixed_bill_current/);
            const start = hook.indexOf('const payFixedBill');
            const end = hook.indexOf('const importTransactions', start);
            const payBlock = hook.slice(start, end);
            assert.doesNotMatch(payBlock, /mf_create_finance_entry_v3/);
            assert.doesNotMatch(payBlock, /from\('mf_fixed_bills'\)\.update/);
          });

          test('statement import reuses one correlation id through persistence', () => {
            const types = read('src/types.ts');
            const component = read('src/components/ImportarExtratosCore.tsx');
            const hook = read('src/hooks/useDashboardWorkspace.ts');
            assert.match(types, /correlationId\?: string/);
            assert.match(component, /parserName: importDiagnostics\?\.parserLabel,\s*correlationId,/);
            assert.match(hook, /options\.correlationId \|\| createOperationalCorrelationId\(\)/);
          });

          test('statement OCR returns document-level statement balance directly', () => {
            const ocr = read('supabase/functions/statement-ocr/index.ts');
            assert.match(ocr, /statementBalance: metadata\.statement_balance/);
          });
          EOF

      - name: Install and run full gate
        run: |
          npm ci
          npm run check

      - name: Commit validated stabilization patch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/components/ImportarExtratosCore.tsx src/hooks/useDashboardWorkspace.ts supabase/functions/statement-ocr/index.ts tests/stabilization-contracts.test.ts
          git commit -m "fix: close financial stabilization gaps"
          git push origin HEAD:staging/mf-admin-observability-1.4
