name: E2E Dependency Patch

on:
  push:
    branches:
      - agent/remove-user-categorization-rules
    paths:
      - .github/workflows/e2e-dependency-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/remove-user-categorization-rules
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Add Playwright test runner
        run: npm install --save-dev --save-exact @playwright/test@1.62.1
      - name: Verify dependency patch
        run: |
          node -e "const p=require('./package.json'); if(p.devDependencies?.['@playwright/test']!=='1.62.1') process.exit(1)"
          npm install --package-lock-only --ignore-scripts
          git diff --check
      - name: Commit dependency patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: add Playwright e2e runner"
          git push origin HEAD:agent/remove-user-categorization-rules
