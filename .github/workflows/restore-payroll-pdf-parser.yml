name: Restore Payroll PDF Parser

on:
  push:
    branches:
      - agent/mobile-product-integration
    paths:
      - .github/workflows/restore-payroll-pdf-parser.yml

permissions:
  contents: write

jobs:
  restore-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-product-integration
          fetch-depth: 0

      - name: Restore validated parser and align PDF.js worker
        shell: bash
        run: |
          git show 8bbf5fef5225d5564d3b8401a10ee3ce97e88d67:src/lib/payroll-pdf-parser.ts > src/lib/payroll-pdf-parser.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/payroll-pdf-parser.ts')
          text = path.read_text()
          text = text.replace("import * as pdfjs from 'pdfjs-dist';", "import * as pdfjs from 'pdfjs-dist/legacy/build/pdf.mjs';", 1)
          text = text.replace("import pdfWorker from 'pdfjs-dist/build/pdf.worker.min.mjs?url';", "import pdfWorker from 'pdfjs-dist/legacy/build/pdf.worker.min.mjs?url';", 1)
          path.write_text(text)
          PY

      - name: Commit restored parser
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/payroll-pdf-parser.ts
          git commit -m "fix: restore payroll PDF analysis while sharing worker"
          git push origin HEAD:agent/mobile-product-integration
