name: Temporary OCR balance full check

on:
  push:
    branches:
      - staging/mf-admin-observability-1.4
    paths:
      - .github/workflows/temp-ocr-balance-full-check.yml

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
