name: Dependency Lock Refresh

on:
  push:
    branches:
      - agent/remove-user-categorization-rules
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh tsx and transitive esbuild lock
        run: npm install --package-lock-only --ignore-scripts --save-dev 'tsx@^4.23.12'
      - name: Verify dependency audit
        run: npm audit --audit-level=low
      - name: Commit audited manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifests already match the audited lock."
            exit 0
          fi
          git commit -m "security: refresh audited dependency lock"
          git push origin HEAD:agent/remove-user-categorization-rules
