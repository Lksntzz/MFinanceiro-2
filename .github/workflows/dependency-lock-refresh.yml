name: Dependency Lock Refresh

on:
  push:
    branches:
      - agent/remove-user-categorization-rules
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refresh tsx and transitive esbuild lock
        run: npm install --package-lock-only --ignore-scripts --save-dev 'tsx@^4.22.0'
      - name: Verify dependency audit
        run: npm audit --audit-level=low
      - name: Upload refreshed manifests
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-refresh
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
