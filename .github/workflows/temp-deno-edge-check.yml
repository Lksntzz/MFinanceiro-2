name: Temporary Edge Function typecheck

on:
  push:
    branches:
      - staging/mf-admin-observability-1.4
    paths:
      - .github/workflows/temp-deno-edge-check.yml

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check statement OCR
        run: deno check --config supabase/functions/statement-ocr/deno.json supabase/functions/statement-ocr/index.ts
      - name: Check Open Finance session
        run: deno check --config supabase/functions/open-finance-session/deno.json supabase/functions/open-finance-session/index.ts
      - name: Check Open Finance sync
        run: deno check --config supabase/functions/open-finance-sync/deno.json supabase/functions/open-finance-sync/index.ts
      - name: Check Open Finance webhook
        run: deno check --config supabase/functions/open-finance-webhook/deno.json supabase/functions/open-finance-webhook/index.ts
