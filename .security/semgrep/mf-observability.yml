rules:
  - id: mf-critical-operation-needs-correlation
    patterns:
      - pattern: |
          reportOperationalEvent($EVENT, $AREA, $SEV, { route: $R, ... })
      - pattern-not: |
          reportOperationalEvent($EVENT, $AREA, $SEV, { correlationId: $C, ... })
      - pattern-not: |
          reportOperationalEvent($EVENT, $AREA, $SEV, { correlation_id: $C, ... })
    message: "Operações críticas reportadas com route devem incluir correlation_id no contexto de telemetria para rastreamento fim a fim."
    languages: [typescript, javascript]
    severity: WARNING
