rules:
  - id: mf-no-service-role-on-client
    pattern-either:
      - pattern: |
          import.meta.env.VITE_SUPABASE_SERVICE_ROLE_KEY
      - pattern: |
          import.meta.env.VITE_SUPABASE_SERVICE_KEY
      - pattern: |
          import.meta.env.VITE_SERVICE_ROLE
    message: "Nunca exponha uma chave service_role por variável VITE_* no bundle do navegador. Service role deve permanecer somente server-side."
    languages: [typescript, javascript]
    severity: ERROR
