  <path d="M154 253l69 83 39-55-69-80c-14-16-29-25-48-25-10 0-20 3-28 8 16 2 27 12 37 24z" fill="#0b4fe5" opacity=".6"/>
  <rect x="249" y="159" width="27" height="71" rx="5" fill="#1766f0"/>
  <rect x="291" y="129" width="27" height="102" rx="5" fill="#14a8ff"/>
  <rect x="333" y="95" width="27" height="136" rx="5" fill="#24d6f1"/>
  <path d="M302 230h116c12 0 18 14 10 23l-19 22c-6 7-15 11-24 11h-105z" fill="url(#teal)"/>
  <path d="M281 296h101c12 0 18 14 10 23l-18 21c-6 7-15 11-24 11h-91z" fill="url(#teal)"/>
  <path d="M281 296h55l-26 55h-51z" fill="#087f9f" opacity=".56"/>
  <path d="M207 365C245 309 276 270 308 228c33-43 67-88 107-139" fill="none" stroke="url(#rise)" stroke-width="31" stroke-linecap="round"/>
  <path d="M401 77l49-13-11 51-14-15-18 21-24-20 19-22z" fill="#3cf4d5"/>
  <path d="M207 365c38-56 69-95 101-137" fill="none" stroke="#0d62f0" stroke-width="10" stroke-linecap="round" opacity=".46"/>
</g>
</svg>