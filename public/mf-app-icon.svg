<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">MF Financeiro</title>
<desc id="desc">Símbolo MF com barras de análise e seta de crescimento.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071221"/>
    <stop offset="1" stop-color="#020711"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10d8ff"/>
    <stop offset=".48" stop-color="#0b79ff"/>
    <stop offset="1" stop-color="#1239ce"/>
  </linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3fffe8"/>
    <stop offset=".55" stop-color="#0fd9df"/>
    <stop offset="1" stop-color="#0796bc"/>
  </linearGradient>
  <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#1760f5"/>
    <stop offset=".52" stop-color="#17c6ff"/>
    <stop offset="1" stop-color="#38f5d2"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#007dff" flood-opacity=".22"/>
  </filter>
</defs>
<rect x="18" y="18" width="476" height="476" rx="110" fill="url(#bg)" stroke="#2e69c7" stroke-opacity=".55" stroke-width="3"/>
<rect x="23" y="23" width="466" height="466" rx="106" fill="none" stroke="#49d7ff" stroke-opacity=".12" stroke-width="2"/>

<g filter="url(#soft)">
